<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="390" viewBox="0 0 1160 390">
  <title>MID360 UDP 数据到 ROS 2 话题</title>
  <desc>MID360 通过两个 UDP 端口发送点云和 IMU，SDK2 解码后由 ROS 2 驱动发布两个话题。</desc>
  <rect width="1160" height="390" fill="#f7f9fc"/>
  <style>
    .box { fill:#fff; stroke:#234; stroke-width:2; rx:12; }
    .title { font:700 19px sans-serif; fill:#123; }
    .text { font:15px sans-serif; fill:#234; }
    .small { font:13px sans-serif; fill:#456; }
    .arrow { stroke:#4169a1; stroke-width:3; fill:none; marker-end:url(#arrow); }
    .dash { stroke:#9a6a2e; stroke-width:2; stroke-dasharray:8 7; fill:none; marker-end:url(#arrow2); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4169a1"/>
    </marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6a2e"/>
    </marker>
  </defs>
  <text x="38" y="38" class="title">一帧 ROS 2 数据不是一个 UDP 包</text>
  <rect x="35" y="92" width="205" height="190" class="box"/>
  <text x="60" y="128" class="title">MID360</text>
  <text x="60" y="166" class="text">192.168.1.3</text>
  <text x="60" y="204" class="text">56300：点云</text>
  <text x="60" y="237" class="text">56400：IMU</text>
  <text x="60" y="267" class="small">设备协议二进制字节</text>
  <rect x="300" y="92" width="235" height="190" class="box"/>
  <text x="326" y="128" class="title">Jetson 网口</text>
  <text x="326" y="166" class="text">enP8p1s0</text>
  <text x="326" y="204" class="text">192.168.1.50</text>
  <text x="326" y="244" class="small">多个 UDP 包</text>
  <text x="326" y="268" class="small">分段到达、需要组合</text>
  <rect x="595" y="92" width="220" height="190" class="box"/>
  <text x="620" y="128" class="title">Livox SDK2</text>
  <text x="620" y="166" class="text">校验和解析</text>
  <text x="620" y="201" class="text">恢复点、时间、IMU</text>
  <text x="620" y="244" class="small">不发布 ROS 2 话题</text>
  <rect x="875" y="75" width="245" height="225" class="box"/>
  <text x="900" y="112" class="title">livox_ros_driver2</text>
  <text x="900" y="154" class="text">/livox/lidar</text>
  <text x="900" y="180" class="small">CustomMsg</text>
  <text x="900" y="224" class="text">/livox/imu</text>
  <text x="900" y="250" class="small">sensor_msgs/Imu</text>
  <path d="M240 187 L300 187" class="arrow"/>
  <path d="M535 187 L595 187" class="arrow"/>
  <path d="M815 187 L875 187" class="arrow"/>
  <path d="M135 282 C290 350 645 350 730 282" class="dash"/>
  <text x="345" y="350" class="small">多个 UDP 点云包 → SDK2 解析 → 一条 CustomMsg</text>
</svg>
