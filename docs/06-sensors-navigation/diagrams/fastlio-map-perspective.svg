<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <title>FAST-LIO 多帧点云叠加成地图和轨迹</title>
  <desc>机器人在三个位置采集扫描，FAST-LIO 估计每个位置，把点变换到同一 camera_init 坐标系并累积为墙面地图，连续位姿形成路径。</desc>
  <rect width="1200" height="620" fill="#fbfcfe"/>
  <style>
    .title { font:700 23px sans-serif; fill:#17304d; }
    .label { font:18px sans-serif; fill:#23384f; }
    .small { font:15px sans-serif; fill:#53677c; }
    .wall { stroke:#7c8792; stroke-width:7; }
    .ray1 { stroke:#d05b47; stroke-width:2; opacity:.7; }
    .ray2 { stroke:#3f83a5; stroke-width:2; opacity:.7; }
    .ray3 { stroke:#4e9966; stroke-width:2; opacity:.7; }
    .scan1 { fill:#d05b47; }
    .scan2 { fill:#3f83a5; }
    .scan3 { fill:#4e9966; }
    .path { stroke:#d05b47; stroke-width:4; fill:none; marker-end:url(#arrow); }
    .pose { fill:#d05b47; stroke:#fff; stroke-width:3; }
    .box { fill:#fff; stroke:#bdc8d2; stroke-width:2; rx:14; }
    .arrow2 { stroke:#4169a1; stroke-width:3; fill:none; marker-end:url(#arrow2); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d05b47"/></marker>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4169a1"/></marker>
  </defs>
  <text x="40" y="45" class="title">FAST-LIO：三次扫描如何叠成同一张地图</text>

  <!-- common world/map frame -->
  <line x1="85" y1="485" x2="785" y2="485" stroke="#aab5bf" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="85" y1="485" x2="85" y2="140" stroke="#aab5bf" stroke-width="2" stroke-dasharray="8 7"/>
  <text x="88" y="125" class="label">camera_init 原点</text>
  <text x="700" y="515" class="small">统一的建图坐标</text>
  <line x1="610" y1="215" x2="610" y2="470" class="wall"/>
  <line x1="610" y1="215" x2="760" y2="150" class="wall"/>
  <line x1="760" y1="150" x2="760" y2="470" class="wall"/>
  <text x="628" y="190" class="label">房间墙面</text>

  <!-- poses and scan rays -->
  <circle cx="205" cy="430" r="10" class="pose"/>
  <circle cx="350" cy="400" r="10" class="pose"/>
  <circle cx="490" cy="435" r="10" class="pose"/>
  <path d="M205 430 C260 390 300 380 350 400 C410 425 445 450 490 435" class="path"/>
  <text x="180" y="465" class="label">P₀</text>
  <text x="330" y="435" class="label">P₁</text>
  <text x="470" y="470" class="label">P₂</text>
  <text x="270" y="540" class="small">连续位姿 → /path</text>

  <line x1="205" y1="430" x2="610" y2="215" class="ray1"/><line x1="205" y1="430" x2="610" y2="315" class="ray1"/><line x1="205" y1="430" x2="610" y2="430" class="ray1"/>
  <circle cx="610" cy="215" r="5" class="scan1"/><circle cx="610" cy="315" r="5" class="scan1"/><circle cx="610" cy="430" r="5" class="scan1"/>
  <line x1="350" y1="400" x2="610" y2="215" class="ray2"/><line x1="350" y1="400" x2="610" y2="285" class="ray2"/><line x1="350" y1="400" x2="610" y2="430" class="ray2"/>
  <circle cx="610" cy="215" r="5" class="scan2"/><circle cx="610" cy="285" r="5" class="scan2"/><circle cx="610" cy="430" r="5" class="scan2"/>
  <line x1="490" y1="435" x2="610" y2="215" class="ray3"/><line x1="490" y1="435" x2="610" y2="350" class="ray3"/><line x1="490" y1="435" x2="610" y2="430" class="ray3"/>
  <circle cx="610" cy="215" r="5" class="scan3"/><circle cx="610" cy="350" r="5" class="scan3"/><circle cx="610" cy="430" r="5" class="scan3"/>

  <rect x="845" y="105" width="310" height="345" class="box"/>
  <text x="875" y="145" class="title" style="font-size:20px">算法实际做的事</text>
  <text x="875" y="190" class="label">① IMU 估计 P₀、P₁、P₂</text>
  <text x="875" y="230" class="label">② 每帧点云去畸变</text>
  <text x="875" y="270" class="label">③ 点从雷达系变到</text>
  <text x="900" y="298" class="label">camera_init</text>
  <text x="875" y="338" class="label">④ 相邻地图平面匹配</text>
  <text x="875" y="378" class="label">⑤ 有效点加入 /Laser_map</text>
  <line x1="875" y1="405" x2="1125" y2="405" stroke="#d1dae3"/>
  <text x="875" y="430" class="small">不是把三帧原始点直接叠加</text>
  <path d="M785 300 L845 300" class="arrow2"/>
  <text x="40" y="590" class="small">同一面墙在不同采样时刻会落在不同雷达坐标中；只有估计每个时刻的位姿并统一变换后，点才会重合成墙面。</text>
</svg>
