<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760">
  <rect width="1600" height="760" fill="#ffffff"/>
  <style>
    .panel { fill:#fbfdff; stroke:#cbd6e2; stroke-width:2; rx:18; }
    .title { font:700 28px sans-serif; fill:#172b4d; }
    .head { font:700 23px sans-serif; fill:#172b4d; }
    .text { font:18px sans-serif; fill:#26384a; }
    .small { font:16px sans-serif; fill:#52677b; }
    .axis { stroke:#4e8b66; stroke-width:3; marker-end:url(#greenArrow); }
    .arrow { stroke:#2f6fad; stroke-width:4; marker-end:url(#blueArrow); fill:none; }
    .point { fill:#4799d2; opacity:.9; }
    .selected { fill:#ee8c35; }
    .wall { stroke:#5d6b78; stroke-width:8; stroke-linecap:round; }
    .scan { stroke:#d45143; stroke-width:3; marker-end:url(#redArrow); fill:none; }
    .ray { stroke:#d45143; stroke-width:2; opacity:.65; }
    .grid { stroke:#d9e2ea; stroke-width:1; }
  </style>
  <defs>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2f6fad"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#4e8b66"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#d45143"/>
    </marker>
  </defs>

  <text x="46" y="46" class="title">MID360 三维点云怎样变成二维 /scan</text>
  <text x="46" y="78" class="small">pointcloud_to_laserscan 不重新测距，只保留指定高度的点，并把它们按水平角整理成距离数组。</text>

  <rect x="35" y="115" width="350" height="560" class="panel"/>
  <text x="62" y="160" class="head">① 原始三维点云</text>
  <text x="62" y="190" class="small">每个点都有 x、y、z</text>
  <line x1="105" y1="590" x2="300" y2="590" class="axis"/>
  <line x1="105" y1="590" x2="105" y2="365" class="axis"/>
  <text x="307" y="596" class="small">x</text><text x="91" y="355" class="small">z</text>
  <line x1="105" y1="520" x2="330" y2="520" class="grid"/>
  <line x1="105" y1="450" x2="330" y2="450" class="grid"/>
  <line x1="105" y1="380" x2="330" y2="380" class="grid"/>
  <g>
    <circle cx="170" cy="505" r="6" class="point"/><circle cx="195" cy="490" r="6" class="point"/>
    <circle cx="220" cy="475" r="6" class="point"/><circle cx="245" cy="460" r="6" class="point"/>
    <circle cx="275" cy="445" r="6" class="point"/><circle cx="300" cy="430" r="6" class="point"/>
    <circle cx="168" cy="555" r="6" class="point"/><circle cx="205" cy="545" r="6" class="point"/>
    <circle cx="245" cy="535" r="6" class="point"/><circle cx="285" cy="525" r="6" class="point"/>
    <circle cx="180" cy="410" r="6" class="point"/><circle cx="220" cy="400" r="6" class="point"/>
    <circle cx="265" cy="390" r="6" class="point"/><circle cx="310" cy="375" r="6" class="point"/>
  </g>
  <text x="72" y="635" class="small">地面、墙面、桌面等不同高度的点</text>

  <path d="M400 395 L470 395" class="arrow"/>
  <text x="395" y="365" class="small">按 z 筛选</text>

  <rect x="490" y="115" width="350" height="560" class="panel"/>
  <text x="517" y="160" class="head">② 选取高度切片</text>
  <text x="517" y="190" class="small">例如 min_height=-0.10</text>
  <text x="517" y="214" class="small">max_height=0.50</text>
  <line x1="560" y1="590" x2="755" y2="590" class="axis"/>
  <line x1="560" y1="590" x2="560" y2="365" class="axis"/>
  <text x="762" y="596" class="small">x</text><text x="546" y="355" class="small">z</text>
  <rect x="560" y="500" width="235" height="65" fill="#fff0d9" stroke="#ee8c35" stroke-width="2" rx="8"/>
  <text x="577" y="540" class="text">保留的二维观察层</text>
  <g>
    <circle cx="625" cy="525" r="7" class="selected"/><circle cx="665" cy="515" r="7" class="selected"/>
    <circle cx="705" cy="505" r="7" class="selected"/><circle cx="750" cy="530" r="7" class="selected"/>
  </g>
  <g opacity=".22">
    <circle cx="620" cy="555" r="6" class="point"/><circle cx="680" cy="545" r="6" class="point"/>
    <circle cx="635" cy="425" r="6" class="point"/><circle cx="700" cy="400" r="6" class="point"/>
  </g>
  <text x="523" y="635" class="small">高于或低于范围的点不进入 /scan</text>

  <path d="M855 395 L925 395" class="arrow"/>
  <text x="853" y="365" class="small">按角度分桶</text>

  <rect x="945" y="115" width="300" height="560" class="panel"/>
  <text x="972" y="160" class="head">③ 平面投影</text>
  <text x="972" y="190" class="small">只保留 x-y 方向</text>
  <circle cx="1095" cy="430" r="115" fill="#f7fafc" stroke="#aab8c5" stroke-width="2"/>
  <line x1="960" y1="430" x2="1230" y2="430" class="grid"/>
  <line x1="1095" y1="295" x2="1095" y2="565" class="grid"/>
  <circle cx="1095" cy="430" r="8" fill="#2f6fad"/>
  <text x="1075" y="460" class="small">雷达</text>
  <line x1="1095" y1="430" x2="1190" y2="375" class="scan"/>
  <line x1="1095" y1="430" x2="1195" y2="430" class="scan"/>
  <line x1="1095" y1="430" x2="1180" y2="490" class="scan"/>
  <circle cx="1190" cy="375" r="7" class="selected"/><circle cx="1195" cy="430" r="7" class="selected"/><circle cx="1180" cy="490" r="7" class="selected"/>
  <text x="981" y="595" class="small">θ=atan2(y,x)</text>
  <text x="981" y="625" class="small">ρ=√(x²+y²)</text>

  <path d="M1260 395 L1330 395" class="arrow"/>
  <text x="1260" y="365" class="small">整理数组</text>

  <rect x="1350" y="115" width="215" height="560" class="panel"/>
  <text x="1375" y="160" class="head">④ /scan</text>
  <text x="1375" y="195" class="small">LaserScan</text>
  <line x1="1390" y1="555" x2="1530" y2="555" class="grid"/>
  <line x1="1390" y1="475" x2="1530" y2="475" class="grid"/>
  <line x1="1390" y1="395" x2="1530" y2="395" class="grid"/>
  <text x="1375" y="575" class="small">角度</text>
  <text x="1390" y="365" class="small">range[]</text>
  <path d="M1400 535 L1420 510 L1440 520 L1460 440 L1480 485 L1500 415 L1520 455" fill="none" stroke="#d45143" stroke-width="4"/>
  <text x="1375" y="620" class="small">每个角度一个距离</text>
  <text x="1375" y="645" class="small">再交给 SLAM Toolbox</text>
</svg>
