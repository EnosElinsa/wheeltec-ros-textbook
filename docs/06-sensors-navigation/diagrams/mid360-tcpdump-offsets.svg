<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610">
  <title>把 tcpdump 偏移映射到 MID360 UDP 载荷</title>
  <desc>展示无 VLAN、无 IPv4 可选字段时，以太网、IPv4、UDP 和 Livox 载荷的偏移，以及第一个点的起始位置。</desc>
  <rect width="1200" height="610" fill="#fbfcfe"/>
  <style>
    .title { font:700 24px sans-serif; fill:#17304d; }
    .label { font:700 17px sans-serif; fill:#23384f; }
    .small { font:15px sans-serif; fill:#53677c; }
    .tiny { font:13px sans-serif; fill:#53677c; }
    .seg { stroke:#23384f; stroke-width:1.5; }
    .line { stroke:#4169a1; stroke-width:2; fill:none; }
    .mono { font:15px monospace; fill:#23384f; }
  </style>
  <text x="40" y="42" class="title">tcpdump -XX 中的偏移：从网络头到第一个 MID360 点</text>
  <text x="40" y="74" class="small">假设：无 VLAN 标签、IPv4 头 20 字节；真实 MAC、地址、校验和与点值以现场抓包为准。</text>

  <text x="45" y="116" class="label">帧内偏移（十六进制）</text>
  <rect x="45" y="138" width="180" height="78" class="seg" fill="#e8eef7"/>
  <rect x="225" y="138" width="250" height="78" class="seg" fill="#eaf4ed"/>
  <rect x="475" y="138" width="170" height="78" class="seg" fill="#fff1df"/>
  <rect x="645" y="138" width="420" height="78" class="seg" fill="#f7e8ee"/>
  <text x="93" y="169" class="label">0x0000–000d</text><text x="86" y="196" class="small">Ethernet 14 B</text>
  <text x="290" y="169" class="label">0x000e–0021</text><text x="315" y="196" class="small">IPv4 20 B</text>
  <text x="518" y="169" class="label">0x0022–0029</text><text x="515" y="196" class="small">UDP 8 B</text>
  <text x="737" y="169" class="label">0x002a–057f</text><text x="726" y="196" class="small">Livox 载荷 1380 B</text>

  <path d="M645 228 L645 250 L1065 250 L1065 228" class="line"/>
  <text x="735" y="275" class="small">UDP 载荷长度 1380 = 0x564（字段内部按小端存储为 64 05）</text>

  <text x="45" y="324" class="label">载荷内部偏移</text>
  <rect x="45" y="345" width="170" height="78" class="seg" fill="#fff1df"/>
  <rect x="215" y="345" width="230" height="78" class="seg" fill="#e8eef7"/>
  <rect x="445" y="345" width="620" height="78" class="seg" fill="#eaf4ed"/>
  <text x="87" y="376" class="label">0–35</text><text x="79" y="403" class="small">协议头 36 B</text>
  <text x="286" y="376" class="label">36–49</text><text x="277" y="403" class="small">点 0：14 B</text>
  <text x="665" y="376" class="label">50–1379</text><text x="635" y="403" class="small">其余 95 个点：1330 B</text>
  <path d="M215 435 L215 460 L445 460 L445 435" class="line"/>
  <text x="247" y="486" class="small">第一个点在整帧偏移 0x002a + 36 = 0x004e</text>

  <text x="45" y="532" class="label">字段级示意</text>
  <text x="45" y="560" class="mono">0x002a  ?? 64 05 ?? ?? 60 00 …… 01 ……</text>
  <text x="45" y="586" class="mono">0x004e  88 13 00 00 | 00 00 00 00 | b0 04 00 00 | 78 | 00</text>
</svg>
