<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="ros2-system-layers-title ros2-system-layers-desc">
  <title id="ros2-system-layers-title">ROS 2 在 WHEELTEC 机器人中的位置</title>
  <desc id="ros2-system-layers-desc">分层图展示 Ubuntu、ROS 2 软件平台、底盘通信和底层控制硬件之间的依赖关系。</desc>
  <defs>
    <marker id="ros2-system-layers-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#4f5d75"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text x="80" y="76" fill="#4f5d75" font-size="12" font-family="system-ui, sans-serif" letter-spacing="2">SYSTEM LAYERS · WHEELTEC ROS 2</text>
  <text x="80" y="124" fill="#2d3142" font-size="28" font-weight="600" font-family="system-ui, sans-serif">从操作系统到电机控制</text>
  <text x="80" y="156" fill="#4f5d75" font-size="16" font-family="system-ui, sans-serif">每一层承担不同职责，故障定位沿层次逐级进行。</text>

  <rect x="80" y="220" width="1120" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <rect x="80" y="320" width="1120" height="112" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
  <rect x="80" y="444" width="1120" height="88" rx="8" fill="#ffffff" stroke="#4f5d75" stroke-width="1"/>
  <rect x="80" y="544" width="1120" height="88" rx="8" fill="#ececec" stroke="#4f5d75" stroke-width="1"/>

  <text x="112" y="252" fill="#7a8399" font-size="12" font-family="ui-monospace, monospace" letter-spacing="2">LAYER 01</text>
  <text x="112" y="284" fill="#2d3142" font-size="20" font-weight="600" font-family="system-ui, sans-serif">Ubuntu 操作系统</text>
  <text x="708" y="276" fill="#4f5d75" font-size="16" font-family="system-ui, sans-serif">处理器 · 内存 · 文件 · 网络 · 设备</text>

  <text x="112" y="356" fill="#eb6c36" font-size="12" font-family="ui-monospace, monospace" letter-spacing="2">LAYER 02 · FOCAL</text>
  <text x="112" y="394" fill="#2d3142" font-size="24" font-weight="600" font-family="system-ui, sans-serif">ROS 2 软件平台</text>
  <text x="708" y="382" fill="#4f5d75" font-size="16" font-family="system-ui, sans-serif">驱动 · 感知 · 定位 · 导航 · 工具</text>
  <text x="708" y="408" fill="#7a8399" font-size="12" font-family="ui-monospace, monospace">nodes · topics · services · actions · parameters</text>

  <text x="112" y="476" fill="#7a8399" font-size="12" font-family="ui-monospace, monospace" letter-spacing="2">LAYER 03</text>
  <text x="112" y="508" fill="#2d3142" font-size="20" font-weight="600" font-family="system-ui, sans-serif">底盘通信</text>
  <text x="708" y="500" fill="#4f5d75" font-size="16" font-family="system-ui, sans-serif">串行通信 · CAN · 协议帧</text>

  <text x="112" y="576" fill="#7a8399" font-size="12" font-family="ui-monospace, monospace" letter-spacing="2">LAYER 04</text>
  <text x="112" y="608" fill="#2d3142" font-size="20" font-weight="600" font-family="system-ui, sans-serif">控制板与执行机构</text>
  <text x="708" y="600" fill="#4f5d75" font-size="16" font-family="system-ui, sans-serif">STM32 · 电机驱动器 · 电机 · 机械结构</text>

  <path d="M640 308V320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ros2-system-layers-arrow)"/>
  <path d="M640 432V444" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ros2-system-layers-arrow)"/>
  <path d="M640 532V544" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ros2-system-layers-arrow)"/>
</svg>
