name: Validate code resources

on:
  push:
    paths:
      - "metadata/code-resources.yml"
      - "docs/appendices/d-public-source-reference.md"
      - "tools/validate_code_resources.py"
      - "tools/generate_code_appendix.py"
      - ".github/workflows/validate-code-resources.yml"
  pull_request:
    paths:
      - "metadata/code-resources.yml"
      - "docs/appendices/d-public-source-reference.md"
      - "tools/validate_code_resources.py"
      - "tools/generate_code_appendix.py"
      - ".github/workflows/validate-code-resources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate textbook against pinned source
    runs-on: ubuntu-latest
    steps:
      - name: Check out textbook
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Read pinned source revision
        id: source
        shell: bash
        run: |
          SOURCE_REPOSITORY="$(python -c 'import yaml; print(yaml.safe_load(open("metadata/code-resources.yml"))["source_repository"])')"
          SOURCE_REVISION="$(python -c 'import yaml; print(yaml.safe_load(open("metadata/code-resources.yml"))["source_revision"])')"
          echo "repository=$SOURCE_REPOSITORY" >> "$GITHUB_OUTPUT"
          echo "revision=$SOURCE_REVISION" >> "$GITHUB_OUTPUT"

      - name: Clone source into a separate checkout
        shell: bash
        run: |
          SOURCE_REVISION="${{ steps.source.outputs.revision }}"
          git clone --no-checkout "https://github.com/${{ steps.source.outputs.repository }}.git" "$RUNNER_TEMP/wheeltec-ros-source-reference"
          cd "$RUNNER_TEMP/wheeltec-ros-source-reference"
          git checkout --detach "$SOURCE_REVISION"

      - name: Validate mapping and Appendix D
        shell: bash
        run: |
          set -o pipefail
          SOURCE_ROOT="$RUNNER_TEMP/wheeltec-ros-source-reference" python -c 'import os, sys; from pathlib import Path; sys.path.insert(0, "tools"); from validate_code_resources import run_code_resource_validation; raise SystemExit(run_code_resource_validation(Path("."), Path(os.environ["SOURCE_ROOT"])))' | tee "$RUNNER_TEMP/code-resource-validation.log"

      - name: Verify public source tree is code only
        shell: bash
        run: |
          SOURCE_ROOT="$RUNNER_TEMP/wheeltec-ros-source-reference" python -c 'import os, sys; from pathlib import Path; sys.path.insert(0, "tools"); from validate_code_resources import validate_public_source_tree; errors=validate_public_source_tree(Path(os.environ["SOURCE_ROOT"])); print("\n".join(errors) if errors else "public source tree integrity passed"); raise SystemExit(bool(errors))'

      - name: Check public textbook hygiene
        run: python tools/quality.py check --root . --editorial-strict

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-resource-validation-log
          path: ${{ runner.temp }}/code-resource-validation.log
