name: Test ROS 2 examples

on:
  push:
    paths:
      - "metadata/code-resources.yml"
      - "docs/04-ros2-development/**"
      - ".github/workflows/test-ros2-examples.yml"
  pull_request:
    paths:
      - "metadata/code-resources.yml"
      - "docs/04-ros2-development/**"
      - ".github/workflows/test-ros2-examples.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ros:humble-ros-base-jammy
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install mapping parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Fetch textbook code repository
        run: |
          SOURCE_REVISION="$(python -c 'import yaml; print(yaml.safe_load(open("metadata/code-resources.yml"))["source_revision"])')"
          test "${#SOURCE_REVISION}" -eq 40
          git clone --no-checkout https://github.com/EnosElinsa/wheeltec-ros-source-reference.git /tmp/wheeltec-ros-source-reference
          cd /tmp/wheeltec-ros-source-reference
          git checkout --detach "$SOURCE_REVISION"

      - name: Create isolated ROS 2 workspace
        run: |
          mkdir -p /tmp/wheeltec_course_ws/src
          cp -r /tmp/wheeltec-ros-source-reference/examples/ros2/pubsub/cpp /tmp/wheeltec_course_ws/src/cpp_pubsub
          cp -r /tmp/wheeltec-ros-source-reference/examples/ros2/pubsub/python /tmp/wheeltec_course_ws/src/py_pubsub

      - name: Build packages
        run: |
          source /opt/ros/humble/setup.bash
          cd /tmp/wheeltec_course_ws
          colcon build --event-handlers console_direct+

      - name: Run package tests
        run: |
          source /opt/ros/humble/setup.bash
          source /tmp/wheeltec_course_ws/install/setup.bash
          cd /tmp/wheeltec_course_ws
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
