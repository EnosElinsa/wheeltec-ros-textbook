site_name: WHEELTEC ROS 工程教材
docs_dir: docs
site_dir: site
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang:
        - zh
        - en
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
strict: true
