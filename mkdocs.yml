  language: zh
  features:
    - navigation.sections
    - navigation.path
    - navigation.footer
    - search.suggest
    - search.highlight
plugins:
  - search:
      lang:
        - zh
        - en
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
strict: true
